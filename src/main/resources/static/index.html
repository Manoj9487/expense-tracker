<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
    <h1>Personal Expense Tracker</h1>
</header>

<main class="container">

    <section class="dashboard" id="dashboard">
        <div class="summary-card">
            <span class="summary-label">Total Spending</span>
            <span class="summary-value" id="totalSpending">$0.00</span>
        </div>
        <div class="summary-card">
            <span class="summary-label">This Month</span>
            <span class="summary-value" id="monthlySpending">$0.00</span>
        </div>
        <div class="summary-card category-breakdown" id="categoryBreakdown">
            <span class="summary-label">By Category</span>
            <div id="categoryList" class="category-list"><!-- populated by JS --></div>
        </div>
    </section>

    <section class="form-section">
        <h2 id="formTitle">Add Expense</h2>
        <form id="expenseForm">
            <input type="hidden" id="expenseId" value="">

            <div class="form-row">
                <label for="title">Title</label>
                <input type="text" id="title" required maxlength="100" placeholder="e.g., Grocery shopping">
            </div>

            <div class="form-row">
                <label for="amount">Amount</label>
                <input type="number" id="amount" required min="0.01" step="0.01" placeholder="0.00">
            </div>

            <div class="form-row">
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select category</option>
                    <option value="FOOD">Food</option>
                    <option value="TRANSPORT">Transport</option>
                    <option value="EDUCATION">Education</option>
                    <option value="SHOPPING">Shopping</option>
                    <option value="HEALTH">Health</option>
                    <option value="ENTERTAINMENT">Entertainment</option>
                    <option value="BILLS">Bills</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>

            <div class="form-row">
                <label for="expenseDate">Date</label>
                <input type="date" id="expenseDate" required>
            </div>

            <div class="form-row">
                <label for="paymentMethod">Payment Method</label>
                <select id="paymentMethod" required>
                    <option value="">Select payment method</option>
                    <option value="CASH">Cash</option>
                    <option value="CARD">Card</option>
                    <option value="UPI">UPI</option>
                    <option value="NET_BANKING">Net Banking</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>

            <div class="form-row">
                <label for="description">Description (optional)</label>
                <textarea id="description" maxlength="255" placeholder="Any notes..."></textarea>
            </div>

            <div class="form-error" id="formError"></div>

            <div class="form-actions">
                <button type="submit" id="submitBtn">Add Expense</button>
                <button type="button" id="cancelEditBtn" class="secondary-btn hidden">Cancel</button>
            </div>
        </form>
    </section>

    <section class="filters-section">
        <div class="filter-row">
            <label for="filterCategory">Category</label>
            <select id="filterCategory">
                <option value="">All</option>
                <option value="FOOD">Food</option>
                <option value="TRANSPORT">Transport</option>
                <option value="EDUCATION">Education</option>
                <option value="SHOPPING">Shopping</option>
                <option value="HEALTH">Health</option>
                <option value="ENTERTAINMENT">Entertainment</option>
                <option value="BILLS">Bills</option>
                <option value="OTHER">Other</option>
            </select>

            <label for="filterStartDate">From</label>
            <input type="date" id="filterStartDate">

            <label for="filterEndDate">To</label>
            <input type="date" id="filterEndDate">

            <label for="sortBy">Sort by</label>
            <select id="sortBy">
                <option value="expenseDate">Date</option>
                <option value="amount">Amount</option>
            </select>

            <select id="sortDirection">
                <option value="desc">Descending</option>
                <option value="asc">Ascending</option>
            </select>

            <button type="button" id="applyFiltersBtn">Apply</button>
            <button type="button" id="clearFiltersBtn" class="secondary-btn">Clear</button>
        </div>
    </section>

    <section class="list-section">
        <h2>Expenses</h2>
        <div id="expenseList" class="expense-list">
            <!-- populated by JS -->
            <p class="empty-state" id="emptyState">No expenses yet. Add one above.</p>
        </div>
    </section>

</main>

<script src="js/app.js"></script>
</body>
</html>
